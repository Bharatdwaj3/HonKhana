apiVersion: apps/v1
kind: Deployment

metadata:
  name: catalog-db

spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: catalog-db
    spec:
      containers:
        - envFrom:
          - secretRef:
              name: catalog-secrets 
          image: postgres:15-alpine
          livenessProbe:
            exec:
              command:
                - pg_isready 
                - -U
                - catalog_user 
                - -d 
                - catalog_db
            failureThreshold: 5
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          name: catalog-db-ctr
          ports:
            - containerPort: 5432
          resources: {}
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: catalog-data
      restartPolicy: Always
      volumes:
        - name: catalog-data
          persistentVolumeClaim:
            claimName: catalog-data

